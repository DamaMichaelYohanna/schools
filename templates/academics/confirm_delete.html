{% extends 'base.html' %}

{% block title %}Confirm Delete | {{ school_setting.school_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white rounded-3xl p-8 border border-slate-200/80 shadow-lg text-center space-y-5">
    <div class="w-14 h-14 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    </div>

    <div>
        <h2 class="text-lg font-extrabold text-slate-900">{{ title }}</h2>
        <p class="text-xs text-slate-500 mt-2">Are you sure you want to remove <strong class="text-slate-800">{{ object }}</strong>? This action cannot be undone.</p>
    </div>

    <form method="POST" class="flex items-center justify-center space-x-3 pt-3">
        {% csrf_token %}
        <a href="{% url cancel_url %}" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
            Cancel
        </a>
        <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-md shadow-rose-600/20 transition cursor-pointer">
            Yes, Remove
        </button>
    </form>
</div>
{% endblock %}
